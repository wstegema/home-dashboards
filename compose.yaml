services:
  home-dashboards:
    image: ghcr.io/wstegema/home-dashboards:latest
    container_name: home-dashboards
    restart: unless-stopped
    ports:
      - "8095:8080"
    environment:
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
    labels:
      net.unraid.docker.icon: https://raw.githubusercontent.com/wstegema/home-dashboards/main/web/shared/icon.png
      net.unraid.docker.webui: http://[IP]:[PORT:8095]/status/
