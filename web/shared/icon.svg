<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- App icon: the dashboard's progress rings, in its palette (tokens.css). -->
  <rect width="100" height="100" rx="22" fill="#000"/>
  <g fill="none" stroke-width="9" transform="rotate(-90 50 50)">
    <circle cx="50" cy="50" r="36" stroke="#3a3a3a"/>
    <circle cx="50" cy="50" r="36" stroke="#ff8000" stroke-linecap="round" pathLength="100" stroke-dasharray="68 100"/>
    <circle cx="50" cy="50" r="22" stroke="#3a3a3a"/>
    <circle cx="50" cy="50" r="22" stroke="#00d8ff" stroke-linecap="round" pathLength="100" stroke-dasharray="40 100"/>
  </g>
  <circle cx="50" cy="50" r="6" fill="#ffe000"/>
</svg>
